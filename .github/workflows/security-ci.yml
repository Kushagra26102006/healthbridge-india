name: HealthBridge Security CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly automated dependency & static security check (Mondays 03:00 UTC)
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security-checks:
    name: Dependency Audit, Static Analysis, Secret Scan & Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies safely (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Static type check & lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Dependency vulnerability audit (block on HIGH or CRITICAL production advisories)
        id: audit
        run: |
          pnpm audit --prod --json > security-audit-report.json || true
          pnpm audit --prod --audit-level=high

      - name: Secret exposure scan (redacted — never prints matched values)
        run: |
          if grep -rnE --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=dist \
            "(AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|mongodb\+srv://[^<][^\"'[:space:]]+:[^<][^\"'[:space:]]+@)" \
            apps/ packages/ >/dev/null 2>&1; then
            echo "::error::Potential secret pattern detected in source files. Run local secret audit and rotate exposed credentials."
            exit 1
          fi
          echo "Secret pattern scan passed (0 matches)."

      - name: Run automated backend & security test suite
        run: pnpm test

      - name: Production build verification
        run: pnpm build

      - name: Upload security audit report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-audit-report
          path: security-audit-report.json
          if-no-files-found: ignore
